[package]
name = "molemap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for Mullvad VPN with a world map of relays you can click to connect"
license = "MIT"
repository = "https://github.com/Seglectic/molemap"
readme = "README.md"
keywords = ["mullvad", "vpn", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/docs"]

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
